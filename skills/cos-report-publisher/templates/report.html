<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --text-dim: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
    --orange: #d29922;
    --red: #f85149;
    --purple: #bc8cff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    padding: 2rem;
  }
  .container { max-width: 960px; margin: 0 auto; }

  /* Header */
  .header {
    padding-bottom: 1.5rem;
    margin-bottom: 2rem;
    border-bottom: 1px solid var(--border);
  }
  .header h1 { font-size: 1.75rem; font-weight: 600; }
  .header .meta {
    color: var(--text-dim);
    font-size: 0.875rem;
    margin-top: 0.5rem;
  }
  .header .meta span { margin-right: 1.5rem; }

  /* Cards */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1.25rem;
    margin-bottom: 1rem;
  }
  .card h2 {
    font-size: 1.125rem;
    font-weight: 600;
    margin-bottom: 0.75rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  /* Badge */
  .badge {
    display: inline-block;
    padding: 0.125rem 0.5rem;
    border-radius: 12px;
    font-size: 0.75rem;
    font-weight: 500;
    line-height: 1.5;
  }
  .badge-green { background: rgba(63,185,80,0.15); color: var(--green); }
  .badge-orange { background: rgba(210,153,34,0.15); color: var(--orange); }
  .badge-red { background: rgba(248,81,73,0.15); color: var(--red); }
  .badge-purple { background: rgba(188,140,255,0.15); color: var(--purple); }
  .badge-blue { background: rgba(88,166,255,0.15); color: var(--accent); }

  /* Stat grid */
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 1rem;
    margin-bottom: 1.5rem;
  }
  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1rem;
    text-align: center;
  }
  .stat .value {
    font-size: 1.5rem;
    font-weight: 700;
    line-height: 1.2;
  }
  .stat .label {
    color: var(--text-dim);
    font-size: 0.8125rem;
    margin-top: 0.25rem;
  }

  /* Table */
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.875rem;
  }
  th {
    text-align: left;
    padding: 0.5rem 0.75rem;
    border-bottom: 1px solid var(--border);
    color: var(--text-dim);
    font-weight: 500;
  }
  td {
    padding: 0.5rem 0.75rem;
    border-bottom: 1px solid var(--border);
  }
  tr:last-child td { border-bottom: none; }

  /* Progress bar */
  .progress {
    height: 6px;
    background: #21262d;
    border-radius: 3px;
    overflow: hidden;
    margin: 0.5rem 0;
  }
  .progress-bar {
    height: 100%;
    border-radius: 3px;
    background: var(--accent);
  }

  /* Footer */
  .footer {
    margin-top: 2.5rem;
    padding-top: 1rem;
    border-top: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 0.8125rem;
    text-align: center;
  }

  /* Section */
  .section { margin-bottom: 2rem; }
  .section-title {
    font-size: 1.25rem;
    font-weight: 600;
    margin-bottom: 1rem;
    padding-bottom: 0.5rem;
    border-bottom: 1px solid var(--border);
  }

  /* Key-value list */
  .kv-list { list-style: none; }
  .kv-list li {
    display: flex;
    padding: 0.4rem 0;
    border-bottom: 1px solid rgba(48,54,61,0.5);
    font-size: 0.875rem;
  }
  .kv-list li:last-child { border-bottom: none; }
  .kv-list .key {
    color: var(--text-dim);
    min-width: 120px;
    flex-shrink: 0;
  }
  .kv-list .value { flex: 1; }

  @media (max-width: 640px) {
    body { padding: 1rem; }
    .stats { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>{{TITLE}}</h1>
    <div class="meta">
      <span>📅 {{DATE}}</span>
      <span>🏷️ {{TAGS}}</span>
    </div>
  </div>

  {{CONTENT}}

  <div class="footer">
    由 Hermes Agent 自动生成 · {{DATE}}
  </div>
</div>
</body>
</html>
